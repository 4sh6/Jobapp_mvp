<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Oops! Something went wrong - KoderHyre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .error-card { background: white; padding: 3rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        .error-code { font-size: 6rem; font-weight: 800; color: #667eea; line-height: 1; margin-bottom: 1rem; }
        .error-message { color: #666; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">Oops!</div>
        <h3 class="mb-3">Something went wrong</h3>
        <p class="error-message" th:text="${errorMessage}">We couldn't process your request.</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a th:if="${referer != null}" th:href="${referer}" class="btn btn-outline-secondary px-4 py-2">← Go Back</a>
            <a href="/" class="btn btn-primary px-4 py-2 fw-bold">Return to Home</a>
        </div>
    </div>
</body>
</html>
