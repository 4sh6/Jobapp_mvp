<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Profile - KoderHyre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        .form-control, .form-select {
            border: 1.5px solid #e5e7eb; border-radius: .6rem; padding: .65rem .9rem;
            font-size: .9rem; transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); outline: none;
        }
        .form-label { font-weight: 600; font-size: .83rem; color: #374151; margin-bottom: .35rem; }
        .help-text  { font-size: .77rem; color: #94a3b8; margin-top: .2rem; }
        .is-invalid { border-color: #ef4444 !important; }
        .invalid-feedback { display: block; color: #ef4444; font-size: .78rem; margin-top: .2rem; }
        .btn-save {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff; border: none; border-radius: .6rem; padding: .7rem 2rem;
            font-weight: 700; cursor: pointer; transition: opacity .2s;
        }
        .btn-save:hover { opacity: .9; }
    </style>
</head>
<body>

<aside th:replace="~{fragments/sidebar :: sidebar('edit-profile')}"></aside>

<main class="main-content">

    <div class="top-bar">
        <div class="page-title">Edit <span>Profile</span></div>
        <a href="/jobseeker/profile" style="color:#6366f1; font-weight:600; text-decoration:none; font-size:.9rem;">
            <i class="fas fa-eye" style="margin-right:.3rem;"></i>View Profile
        </a>
    </div>

    <form th:action="@{/jobseeker/profile/edit}" th:object="${profileDto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Basic Details -->
        <div class="form-card">
            <div class="form-card-title"><i class="fas fa-user-circle"></i> Basic Details</div>
            <div class="mb-3">
                <label class="form-label">Profile Headline</label>
                <input type="text" class="form-control" th:field="*{profileHeadline}"
                       th:classappend="${#fields.hasErrors('profileHeadline')} ? 'is-invalid' : ''"
                       placeholder="e.g., Senior Software Engineer · 5 years · Java, Spring Boot"/>
                <div class="help-text">Your one-line professional identity</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('profileHeadline')}" th:errors="*{profileHeadline}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">About Me</label>
                <textarea class="form-control" th:field="*{about}" rows="4"
                          th:classappend="${#fields.hasErrors('about')} ? 'is-invalid' : ''"
                          placeholder="Tell recruiters what drives you, your accomplishments, and what you're looking for."></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('about')}" th:errors="*{about}"></div>
            </div>
        </div>

        <!-- Experience -->
        <div class="form-card">
            <div class="form-card-title"><i class="fas fa-briefcase"></i> Professional Experience</div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Years of Experience *</label>
                    <input type="number" class="form-control" th:field="*{experienceYears}" min="0" required
                           th:classappend="${#fields.hasErrors('experienceYears')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('experienceYears')}" th:errors="*{experienceYears}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Additional Months</label>
                    <input type="number" class="form-control" th:field="*{experienceMonths}" min="0" max="11"
                           th:classappend="${#fields.hasErrors('experienceMonths')} ? 'is-invalid' : ''"/>
                    <div class="help-text">0–11</div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Current Company</label>
                    <input type="text" class="form-control" th:field="*{currentCompany}" placeholder="Acme Corp"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Current Role</label>
                    <input type="text" class="form-control" th:field="*{currentRole}" placeholder="Software Engineer"/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Past Companies</label>
                <input type="text" class="form-control" th:field="*{pastCompanies}" placeholder="Google, Amazon (comma separated)"
                       th:classappend="${#fields.hasErrors('pastCompanies')} ? 'is-invalid' : ''"/>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Current CTC (LPA)</label>
                    <input type="number" class="form-control" th:field="*{currentCtc}" step="0.1" placeholder="0.0"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Expected CTC (LPA) *</label>
                    <input type="number" class="form-control" th:field="*{expectedCtc}" step="0.1" placeholder="0.0" required
                           th:classappend="${#fields.hasErrors('expectedCtc')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('expectedCtc')}" th:errors="*{expectedCtc}"></div>
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div class="form-card">
            <div class="form-card-title"><i class="fas fa-code"></i> Skills</div>
            <div class="mb-3">
                <label class="form-label">Primary Skills *</label>
                <textarea class="form-control" th:field="*{primarySkills}" rows="2" required
                          th:classappend="${#fields.hasErrors('primarySkills')} ? 'is-invalid' : ''"
                          placeholder="Java, Spring Boot, Microservices"></textarea>
                <div class="help-text">Your strongest technical skills (comma separated)</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('primarySkills')}" th:errors="*{primarySkills}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Other Skills *</label>
                <textarea class="form-control" th:field="*{skills}" rows="2" required
                          th:classappend="${#fields.hasErrors('skills')} ? 'is-invalid' : ''"
                          placeholder="Git, Docker, AWS, Agile"></textarea>
                <div class="help-text">Supporting and soft skills (comma separated)</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}"></div>
            </div>
        </div>

        <!-- Education -->
        <div class="form-card">
            <div class="form-card-title"><i class="fas fa-graduation-cap"></i> Education</div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Highest Qualification *</label>
                    <select class="form-select" th:field="*{highestEducation}" required
                            th:classappend="${#fields.hasErrors('highestEducation')} ? 'is-invalid' : ''">
                        <option value="">Select degree</option>
                        <option value="HIGH_SCHOOL">High School</option>
                        <option value="DIPLOMA">Diploma</option>
                        <option value="BACHELORS">Bachelor's Degree</option>
                        <option value="MASTERS">Master's Degree</option>
                        <option value="PHD">PhD</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('highestEducation')}" th:errors="*{highestEducation}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Field of Study</label>
                    <input type="text" class="form-control" th:field="*{fieldOfStudy}" placeholder="Computer Science"/>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Institution</label>
                    <input type="text" class="form-control" th:field="*{institution}" placeholder="IIT Delhi"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Graduation Year</label>
                    <input type="number" class="form-control" th:field="*{graduationYear}" placeholder="2023" min="1950" max="2100"/>
                </div>
            </div>
        </div>

        <!-- Preferences -->
        <div class="form-card">
            <div class="form-card-title"><i class="fas fa-sliders-h"></i> Job Preferences</div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Preferred Locations *</label>
                    <input type="text" class="form-control" th:field="*{preferredLocations}"
                           placeholder="Bangalore, Mumbai, Delhi (comma separated)" required
                           th:classappend="${#fields.hasErrors('preferredLocations')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('preferredLocations')}" th:errors="*{preferredLocations}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Work Mode *</label>
                    <select class="form-select" th:field="*{workMode}" required
                            th:classappend="${#fields.hasErrors('workMode')} ? 'is-invalid' : ''">
                        <option value="">Select mode</option>
                        <option value="ONSITE">On-site</option>
                        <option value="REMOTE">Remote</option>
                        <option value="HYBRID">Hybrid</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('workMode')}" th:errors="*{workMode}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Notice Period (days)</label>
                <input type="number" class="form-control" th:field="*{noticePeriodDays}" placeholder="30" min="0" style="max-width:200px;"/>
            </div>
        </div>

        <!-- Actions -->
        <div style="display:flex; justify-content:flex-end; gap:.75rem; margin-bottom:2rem;">
            <a href="/jobseeker/profile" style="padding:.7rem 1.5rem; border-radius:.6rem; border:1.5px solid #e5e7eb; color:#475569; font-weight:600; text-decoration:none; font-size:.9rem;">
                Cancel
            </a>
            <button type="submit" class="btn-save">Save Changes</button>
        </div>
    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
