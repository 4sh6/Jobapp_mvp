<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Interview Requests - Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<aside th:replace="~{fragments/sidebar :: sidebar('requests')}"></aside>

<main class="main-content">

    <div class="top-bar">
        <div class="page-title"><i class="fas fa-bell" style="color:#6366f1; margin-right:.4rem;"></i>Interview <span>Requests</span></div>
        <div style="font-size:.85rem; color:#94a3b8;">
            <span th:text="${invites != null ? invites.size() : 0}">0</span> pending
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" style="background:#d1fae5;border-left:4px solid #10b981;border-radius:0.75rem;padding:1rem 1.5rem;margin:0 1.5rem 1.5rem;color:#065f46;font-weight:600;">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
    </div>
    <div th:if="${info}" style="background:#e0f2fe;border-left:4px solid #38bdf8;border-radius:0.75rem;padding:1rem 1.5rem;margin:0 1.5rem 1.5rem;color:#0c4a6e;font-weight:600;">
        <i class="fas fa-info-circle me-2"></i><span th:text="${info}"></span>
    </div>

    <div class="section-card">
        <div class="section-header">
            <h2><i class="fas fa-calendar-check"></i> Pending Invitations</h2>
        </div>
        <div class="section-body">

            <div th:if="${invites != null && invites.size() > 0}">
                <div th:each="invite : ${invites}" class="invite-card">
                    <div>
                        <div class="invite-card-title" th:text="${invite.job.title}">Job Title</div>
                        <div class="invite-card-meta" style="margin-top:.4rem;">
                            <span><i class="fas fa-building"></i> <span th:text="${invite.job.recruiter.company.name}">Company</span></span>
                            <span><i class="fas fa-map-marker-alt"></i> <span th:text="${invite.job.location}">Location</span></span>
                            <span><i class="fas fa-rupee-sign"></i>
                                <span th:text="${invite.job.salaryMin + ' – ' + invite.job.salaryMax + ' LPA'}">Salary</span>
                            </span>
                            <span><i class="fas fa-user-clock"></i>
                                <span th:text="${invite.job.experienceMin + '–' + invite.job.experienceMax + ' yrs exp'}">Exp</span>
                            </span>
                            <span><i class="fas fa-laptop-house"></i> <span th:text="${invite.job.workMode}">Mode</span></span>
                        </div>
                        <div style="margin-top:.5rem; font-size:.8rem; color:#94a3b8;">
                            <i class="fas fa-tag"></i>
                            <span th:text="${invite.job.requiredSkills}">Skills</span>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:.5rem;">
                        <span class="invite-new-badge">New</span>
                        <div style="display:flex; gap:.5rem; margin-top:.25rem;">
                            <form method="post" th:action="@{'/jobseeker/invite/' + ${invite.id} + '/accept'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn-accept"><i class="fas fa-check" style="margin-right:.3rem;"></i>Accept</button>
                            </form>
                            <form method="post" th:action="@{'/jobseeker/invite/' + ${invite.id} + '/decline'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn-decline"><i class="fas fa-times" style="margin-right:.3rem;"></i>Decline</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:unless="${invites != null && invites.size() > 0}" class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>No Pending Requests</h3>
                <p>You're all caught up. Recruiters will reach out directly as your profile gains visibility.</p>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
