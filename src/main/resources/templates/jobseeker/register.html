<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account - Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh; display: flex; align-items: center; padding: 2rem 1rem;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .auth-card {
            background: #fff; border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
            width: 100%; max-width: 480px; margin: auto;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 2rem; text-align: center; color: #fff;
        }
        .auth-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: .25rem; }
        .auth-header p  { font-size: .9rem; opacity: .85; margin: 0; }
        .auth-body { padding: 2rem; }
        .form-label { font-weight: 600; font-size: .85rem; color: #374151; margin-bottom: .4rem; }
        .form-control {
            border: 1.5px solid #e5e7eb; border-radius: .6rem; padding: .7rem 1rem;
            font-size: .95rem; transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); outline: none;
        }
        .form-control.is-invalid { border-color: #ef4444; }
        .form-control.is-valid   { border-color: #22c55e; }
        .invalid-feedback { color: #ef4444; font-size: .8rem; margin-top: .25rem; display: block; }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute; right: .9rem; top: 50%; transform: translateY(-50%);
            color: #9ca3af; cursor: pointer; font-size: .95rem;
        }
        .input-icon.active { color: #6366f1; }

        /* Password strength */
        .strength-bar { height: 4px; border-radius: 2px; background: #f3f4f6; margin-top: .5rem; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }
        .strength-text { font-size: .75rem; margin-top: .25rem; font-weight: 600; }

        .btn-primary-custom {
            width: 100%; padding: .8rem; border: none; border-radius: .7rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: opacity .2s, transform .1s;
        }
        .btn-primary-custom:hover { opacity: .92; transform: translateY(-1px); }
        .btn-primary-custom:active { transform: translateY(0); }

        .divider { text-align: center; color: #9ca3af; margin: 1.25rem 0; position: relative; }
        .divider::before, .divider::after {
            content: ''; position: absolute; top: 50%; width: 44%; height: 1px; background: #e5e7eb;
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        .btn-google {
            width: 100%; padding: .7rem; border: 1.5px solid #e5e7eb; border-radius: .7rem;
            background: #fff; color: #374151; font-weight: 600; font-size: .9rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .6rem;
            transition: background .2s;
        }
        .btn-google:hover { background: #f9fafb; }

        .auth-footer { text-align: center; padding: 1.25rem; background: #f9fafb; font-size: .9rem; color: #6b7280; }
        .auth-footer a { color: #6366f1; font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-header">
        <h1>Nexhire</h1>
        <p>Join India's top 1% tech talent platform</p>
    </div>

    <div class="auth-body">
        <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:1.25rem; color:#1e293b;">Create your account</h3>

        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" style="border-radius:.6rem; font-size:.85rem;">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/jobseeker/register}" method="post" th:object="${jobseekerRegistrationDto}" id="registerForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                       placeholder="Rahul Sharma" autocomplete="name" required/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       placeholder="you@example.com" autocomplete="email" required/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" class="form-control" th:field="*{password}" id="password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Min. 9 characters" autocomplete="new-password" required minlength="9"/>
                    <span class="input-icon" id="togglePassword"><i class="fas fa-eye"></i></span>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthText" style="color:#9ca3af;">Enter a password</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" class="form-control" id="confirmPassword"
                           placeholder="Re-enter your password" autocomplete="new-password" required/>
                    <span class="input-icon" id="toggleConfirm"><i class="fas fa-eye"></i></span>
                </div>
                <div id="confirmError" class="invalid-feedback" style="display:none;">Passwords do not match</div>
            </div>

            <button type="submit" class="btn-primary-custom" id="submitBtn">Create Account</button>
        </form>
    </div>

    <div class="auth-footer">
        Already have an account? <a href="/jobseeker/login">Sign in</a>
    </div>
</div>

<script>
    // Password visibility toggles
    function toggleVis(inputId, toggleId) {
        const input = document.getElementById(inputId);
        const icon  = document.querySelector('#' + toggleId + ' i');
        input.type  = input.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    }
    document.getElementById('togglePassword').addEventListener('click', () => toggleVis('password', 'togglePassword'));
    document.getElementById('toggleConfirm').addEventListener('click', () => toggleVis('confirmPassword', 'toggleConfirm'));

    // Password strength
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    document.getElementById('password').addEventListener('input', function() {
        const v = this.value;
        let score = 0;
        if (v.length >= 9) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;

        const configs = [
            { w:'0%',   c:'#f3f4f6', label:'', color:'#9ca3af' },
            { w:'25%',  c:'#ef4444', label:'Weak', color:'#ef4444' },
            { w:'50%',  c:'#f59e0b', label:'Fair', color:'#f59e0b' },
            { w:'75%',  c:'#3b82f6', label:'Good', color:'#3b82f6' },
            { w:'100%', c:'#22c55e', label:'Strong', color:'#22c55e' },
        ];
        const cfg = configs[v.length === 0 ? 0 : score] || configs[1];
        fill.style.width = cfg.w;
        fill.style.background = cfg.c;
        text.textContent = cfg.label;
        text.style.color = cfg.color;
    });

    // Confirm password validation
    const confirmInput = document.getElementById('confirmPassword');
    const confirmError = document.getElementById('confirmError');
    function checkConfirm() {
        const match = confirmInput.value === document.getElementById('password').value;
        confirmInput.classList.toggle('is-invalid', !match && confirmInput.value !== '');
        confirmInput.classList.toggle('is-valid', match && confirmInput.value !== '');
        confirmError.style.display = (!match && confirmInput.value !== '') ? 'block' : 'none';
        return match;
    }
    confirmInput.addEventListener('input', checkConfirm);

    // Prevent submit if passwords don't match
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        if (!checkConfirm()) e.preventDefault();
    });
</script>
</body>
</html>
