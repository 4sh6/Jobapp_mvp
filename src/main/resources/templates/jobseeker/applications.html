<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Applications - Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<aside th:replace="~{fragments/sidebar :: sidebar('applications')}"></aside>

<main class="main-content">

    <div class="top-bar">
        <div class="page-title"><i class="fas fa-file-alt" style="color:#6366f1; margin-right:.4rem;"></i>My <span>Applications</span></div>
        <div style="font-size:.85rem; color:#94a3b8;">
            <span th:text="${applications != null ? applications.size() : 0}">0</span> total
        </div>
    </div>

    <div class="section-card">
        <div class="section-header">
            <h2><i class="fas fa-paper-plane"></i> Application History</h2>
        </div>
        <div class="section-body">

            <div th:if="${applications != null && applications.size() > 0}">
                <div th:each="app : ${applications}" style="
                    display:flex; justify-content:space-between; align-items:flex-start;
                    padding:1.1rem 1.25rem; border:1px solid #e2e8f0; border-radius:.75rem;
                    margin-bottom:.75rem; background:#fff; transition: border-color .2s;
                    " onmouseover="this.style.borderColor='#a5b4fc'" onmouseout="this.style.borderColor='#e2e8f0'">
                    <div>
                        <div style="font-weight:700; font-size:1.05rem; color:#1e293b; margin-bottom:.2rem;"
                             th:text="${app.job.title}">Job Title</div>
                        <div style="font-size:.85rem; color:#64748b; margin-bottom:.5rem;">
                            <i class="fas fa-building" style="margin-right:.3rem;"></i>
                            <span th:text="${app.job.recruiter.company.name}">Company</span>
                        </div>
                        <div style="display:flex; flex-wrap:wrap; gap:.75rem; font-size:.82rem; color:#94a3b8;">
                            <span><i class="fas fa-map-marker-alt"></i> <span th:text="${app.job.location}">Location</span></span>
                            <span><i class="fas fa-rupee-sign"></i>
                                <span th:text="${app.job.salaryMin + '–' + app.job.salaryMax + ' LPA'}">Salary</span>
                            </span>
                            <span><i class="fas fa-briefcase"></i>
                                <span th:text="${app.job.experienceMin + '–' + app.job.experienceMax + ' yrs'}">Exp</span>
                            </span>
                            <span th:if="${app.source != null && app.source == 'invite'}">
                                <i class="fas fa-envelope-open-text" style="color:#6366f1;"></i> Via invite
                            </span>
                        </div>
                    </div>
                    <div style="text-align:right; flex-shrink:0; margin-left:1rem;">
                        <span class="status-badge"
                              th:classappend="${app.status.name() == 'APPLIED'     ? ' status-applied'     :
                                              app.status.name() == 'UNDER_REVIEW'  ? ' status-review'      :
                                              app.status.name() == 'SHORTLISTED'   ? ' status-shortlisted'  :
                                              app.status.name() == 'HIRED'         ? ' status-hired'        :
                                                                                      ' status-rejected'}"
                              th:text="${app.status}">APPLIED</span>
                        <div style="font-size:.78rem; color:#94a3b8; margin-top:.4rem;">
                            <i class="fas fa-clock" style="margin-right:.2rem;"></i>
                            <span th:text="${#temporals.format(app.appliedDate, 'dd MMM yyyy')}">Date</span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:unless="${applications != null && applications.size() > 0}" class="empty-state">
                <i class="fas fa-paper-plane"></i>
                <h3>No Applications Yet</h3>
                <p>Once recruiters invite you to interview and you accept, your applications will appear here.</p>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
