<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Upload Your Resume - KoderHyre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .onboarding-container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: auto;
        }
        .progress-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 1rem 1rem 0 0;
        }
        .progress-text {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .step {
            text-align: center;
            flex: 1;
        }
        .step-number {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .step.completed .step-number {
            background: #28a745;
            color: white;
        }
        .step.active .step-number {
            background: white;
            color: #667eea;
        }
        .step-label {
            font-size: 0.85rem;
        }
        .form-section {
            padding: 2rem;
        }
        .form-section h4 {
            color: #333;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 0.5rem;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #f9fafb;
        }
        .upload-area:hover {
            background-color: #f0f4ff;
            border-color: #764ba2;
        }
        .upload-area.dragover {
            background-color: #e8eaff;
            border-color: #764ba2;
            transform: scale(1.02);
        }
        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        .upload-area h5 {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .upload-area p {
            color: #666;
            margin: 0;
        }
        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            font-weight: 600;
        }
        .btn-upload:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
        }
        .file-input {
            display: none;
        }
        .selected-file {
            margin-top: 1.5rem;
        }
        .alert {
            border-radius: 0.5rem;
        }
        .file-info {
            background-color: #f0f9ff;
            padding: 1rem;
            border-radius: 0.5rem;
            border-left: 4px solid #667eea;
        }
        .file-info strong {
            color: #333;
        }
        .help-text {
            color: #666;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container-lg">
    <div class="onboarding-container">
        <!-- Progress Header -->
        <div class="progress-header">
            <div class="progress-text">Complete Your Profile</div>
            <div class="step-indicator">
                <div class="step completed">
                    <div class="step-number">✓</div>
                    <div class="step-label">Profile</div>
                </div>
                <div class="step active">
                    <div class="step-number">2</div>
                    <div class="step-label">Resume</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-label">Done</div>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <h4>📄 Upload Your Resume</h4>
            <p class="text-muted mb-4">Your resume helps employers understand your qualifications and experience.</p>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/jobseeker/resume-onboarding}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="email" th:value="${email}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Upload Area -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <h5>Click to upload or drag and drop</h5>
                    <p class="text-muted mb-0">PDF, DOC or DOCX (Max 5MB)</p>
                </div>

                <input type="file" id="fileInput" name="file" accept=".pdf,.doc,.docx" class="file-input" required/>

                <!-- Selected File Display -->
                <div class="selected-file" id="selectedFile" style="display:none;">
                    <div class="file-info">
                        <strong>Selected File:</strong> <span id="fileName"></span>
                        <br/>
                        <small id="fileSize" class="text-muted"></small>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-upload flex-grow-1">
                        Complete Profile & Continue →
                    </button>
                </div>

                <p class="help-text">
                    You can update your resume later in your profile
                </p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const selectedFile = document.getElementById('selectedFile');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');

    // Click to upload
    uploadArea.addEventListener('click', () => fileInput.click());

    // Drag and drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        fileInput.files = e.dataTransfer.files;
        handleFileSelect();
    });

    // File selection
    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileName.textContent = file.name;
            fileSize.textContent = sizeMB + ' MB';
            selectedFile.style.display = 'block';
            uploadArea.style.opacity = '0.6';
        }
    }
</script>
</body>
</html>
