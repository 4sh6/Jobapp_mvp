<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'JobApp'">JobApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .hero { padding: 5rem 0; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">JobApp</a>
        <div>
            <a class="btn btn-outline-primary me-2" href="/jobseeker/login">Jobseeker</a>
            <a class="btn btn-primary" href="/recruiter/login">Recruiter</a>
        </div>
    </div>
</nav>
<div class="container my-4">

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Jobseeker login</h3>

                <!-- Show error when Spring Security redirects with ?error -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Invalid email or password. If you haven't verified your email, please check your OTP.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
                <div th:if="${param.passwordReset}" class="alert alert-success">Password updated. You can now log in.</div>

                <form th:action="@{/jobseeker/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" required
                               th:value="${session.SPRING_SECURITY_LAST_USERNAME}"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required/>
                    </div>
                    <button class="btn btn-primary w-100">Log in</button>
                </form>
                <div class="d-flex justify-content-between mt-3">
                    <a href="/jobseeker/register">Create an account</a>
                    <a href="/jobseeker/forgot-password">Forgot password?</a>
                </div>

                <div class="mt-4 text-center">
                    <p class="text-muted">or</p>

                    <a href="/oauth2/authorization/google-jobseeker"
                       class="btn btn-outline-dark w-100">
                        <img src="https://developers.google.com/identity/images/g-logo.png"
                             style="height:16px; margin-right:8px;">
                        Continue with Google
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
