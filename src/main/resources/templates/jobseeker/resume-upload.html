
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'JobApp'">JobApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">JobApp</a>
        <div>
            <a class="btn btn-outline-primary me-2" href="/jobseeker/dashboard">Dashboard</a>
            <a class="btn btn-primary" href="/jobseeker/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container my-4">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Upload your resume</h3>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <form th:action="@{/jobseeker/resume}" method="post" enctype="multipart/form-data" th:object="${resumeUploadDto}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label">Resume file</label>
                        <input type="file" th:field="*{file}" class="form-control" required/>
                        <div class="form-text">PDF or Word, max 5MB.</div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preferred job types</label>
                        <input type="text" th:field="*{jobTypes}" class="form-control" placeholder="e.g. Backend, Full-time"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Industries</label>
                        <input type="text" th:field="*{industries}" class="form-control" placeholder="e.g. SaaS, Fintech"/>
                    </div>
                    <button class="btn btn-primary w-100">Upload</button>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
