<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Resume - Nexstaq</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        .form-control, .form-select {
            border: 1.5px solid #e5e7eb; border-radius: .6rem; padding: .65rem .9rem;
            font-size: .9rem; transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); outline: none;
        }
        .form-label { font-weight: 600; font-size: .83rem; color: #374151; margin-bottom: .35rem; }
        .help-text  { font-size: .77rem; color: #94a3b8; margin-top: .25rem; }
        .invalid-feedback { display: block; color: #ef4444; font-size: .78rem; margin-top: .2rem; }

        /* Drop zone */
        .drop-zone {
            border: 2px dashed #c7d2fe;
            border-radius: .9rem;
            background: #f5f3ff;
            padding: 2.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #6366f1;
            background: #eef2ff;
        }
        .drop-zone input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }
        .drop-zone-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: .75rem;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto .9rem;
            font-size: 1.4rem; color: #fff;
        }
        .drop-zone-title { font-weight: 700; color: #1e293b; font-size: 1rem; margin-bottom: .3rem; }
        .drop-zone-sub   { font-size: .82rem; color: #94a3b8; }
        .file-selected   { font-size: .85rem; color: #6366f1; font-weight: 600; margin-top: .75rem; display: none; }

        .btn-save {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff; border: none; border-radius: .6rem; padding: .7rem 2rem;
            font-weight: 700; cursor: pointer; transition: opacity .2s; font-size: .95rem;
        }
        .btn-save:hover { opacity: .9; }

        .format-pill {
            display: inline-flex; align-items: center; gap: .35rem;
            background: #f1f5f9; border-radius: 2rem;
            padding: .3rem .8rem; font-size: .78rem; font-weight: 600; color: #475569;
            margin: .25rem;
        }
    </style>
</head>
<body>

<aside th:replace="~{fragments/sidebar :: sidebar('resume')}"></aside>

<main class="main-content">

    <div class="top-bar">
        <div class="page-title">My <span>Resume</span></div>
        <a href="/jobseeker/profile"
           style="color:#6366f1; font-weight:600; text-decoration:none; font-size:.9rem;">
            <i class="fas fa-user" style="margin-right:.3rem;"></i>View Profile
        </a>
    </div>

    <!-- Error alert -->
    <div th:if="${error}"
         style="background:#fef2f2; border-left:4px solid #ef4444; border-radius:.75rem; padding:1rem 1.25rem; margin-bottom:1.5rem; display:flex; align-items:center; gap:.75rem;">
        <i class="fas fa-exclamation-circle" style="color:#dc2626;"></i>
        <span style="color:#991b1b; font-size:.9rem; font-weight:600;" th:text="${error}"></span>
    </div>

    <form th:action="@{/jobseeker/resume}" method="post" enctype="multipart/form-data"
          th:object="${resumeUploadDto}" id="resumeForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Upload Card -->
        <div class="form-card">
            <div class="form-card-title"><i class="fas fa-file-pdf"></i> Resume File</div>

            <div class="drop-zone" id="dropZone">
                <input type="file" th:field="*{file}" accept=".pdf,.doc,.docx"
                       id="fileInput" required onchange="onFileChange(this)"/>
                <div class="drop-zone-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="drop-zone-title">Drop your resume here or click to browse</div>
                <div class="drop-zone-sub">
                    <span class="format-pill"><i class="fas fa-file-pdf" style="color:#ef4444;"></i> PDF</span>
                    <span class="format-pill"><i class="fas fa-file-word" style="color:#2563eb;"></i> DOC</span>
                    <span class="format-pill"><i class="fas fa-file-word" style="color:#2563eb;"></i> DOCX</span>
                    <div style="margin-top:.5rem;">Maximum file size: <strong>5 MB</strong></div>
                </div>
                <div class="file-selected" id="fileName">
                    <i class="fas fa-check-circle" style="color:#10b981; margin-right:.35rem;"></i>
                    <span id="fileNameText"></span>
                </div>
            </div>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></div>

            <p class="help-text" style="margin-top:.75rem;">
                <i class="fas fa-shield-alt" style="color:#6366f1; margin-right:.3rem;"></i>
                Your resume is only shared with recruiters after you accept their interview invitation.
            </p>
        </div>

        <!-- Actions -->
        <div style="display:flex; justify-content:flex-end; gap:.75rem; margin-bottom:2rem;">
            <a href="/jobseeker/dashboard"
               style="padding:.7rem 1.5rem; border-radius:.6rem; border:1.5px solid #e5e7eb; color:#475569; font-weight:600; text-decoration:none; font-size:.9rem;">
                Cancel
            </a>
            <button type="submit" class="btn-save">
                <i class="fas fa-upload" style="margin-right:.4rem;"></i>Upload Resume
            </button>
        </div>
    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function onFileChange(input) {
        const label = document.getElementById('fileName');
        const nameSpan = document.getElementById('fileNameText');
        if (input.files && input.files[0]) {
            nameSpan.textContent = input.files[0].name;
            label.style.display = 'block';
        }
    }

    // Drag-over visual feedback
    const zone = document.getElementById('dropZone');
    zone.addEventListener('dragover',  () => zone.classList.add('drag-over'));
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop',      () => zone.classList.remove('drag-over'));
</script>
</body>
</html>
