<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify Email - Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh; display: flex; align-items: center; padding: 2rem 1rem;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .auth-card {
            background: #fff; border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
            width: 100%; max-width: 420px; margin: auto; overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 2rem; text-align: center; color: #fff;
        }
        .auth-header .icon-circle {
            width: 64px; height: 64px; background: rgba(255,255,255,.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 1rem;
        }
        .auth-header h2 { font-weight: 700; margin-bottom: .25rem; }
        .auth-body { padding: 2rem; }
        .otp-input {
            text-align: center; font-size: 1.8rem; font-weight: 700;
            letter-spacing: .5rem; border: 2px solid #e5e7eb; border-radius: .7rem;
            padding: .75rem; width: 100%; transition: border-color .2s;
        }
        .otp-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); outline: none; }
        .btn-verify {
            width: 100%; padding: .8rem; border: none; border-radius: .7rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-header">
        <div class="icon-circle"><i class="fas fa-envelope-open-text"></i></div>
        <h2>Check Your Email</h2>
        <p style="opacity:.85; font-size:.9rem; margin:0;">
            We sent a 6-digit code to<br/>
            <strong th:text="${email}">you@example.com</strong>
        </p>
    </div>

    <div class="auth-body">
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" style="border-radius:.6rem; font-size:.85rem;">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${info}" class="alert alert-info d-flex align-items-center gap-2 py-2 mb-3" style="border-radius:.6rem; font-size:.85rem;">
            <i class="fas fa-info-circle"></i> <span th:text="${info}"></span>
        </div>

        <form th:action="@{/jobseeker/verify-otp}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="email" th:value="${email}"/>
            <div class="mb-3">
                <input type="text" class="otp-input" name="code" maxlength="6" inputmode="numeric"
                       placeholder="——————" autocomplete="one-time-code" autofocus required/>
            </div>
            <button type="submit" class="btn-verify">Verify &amp; Continue</button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; font-size:.87rem; color:#6b7280;">
            Didn't receive the code?
            <form th:action="@{/jobseeker/resend-otp}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="email" th:value="${email}"/>
                <button type="submit" style="background:none; border:none; color:#6366f1; font-weight:600; cursor:pointer; padding:0; font-size:.87rem;">
                    Resend code
                </button>
            </form>
        </div>
        <div style="text-align:center; margin-top:.75rem;">
            <a href="/jobseeker/register" style="font-size:.85rem; color:#9ca3af;">
                &larr; Back to registration
            </a>
        </div>
    </div>
</div>
</body>
</html>
