
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'JobApp'">JobApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .hero { padding: 5rem 0; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">JobApp</a>
        <div>
            <a class="btn btn-outline-primary me-2" href="/jobseeker/login">Jobseeker</a>
            <a class="btn btn-primary" href="/recruiter/login">Recruiter</a>
        </div>
    </div>
</nav>
<div class="container my-4">

<h3 class="mb-3">Recruiters</h3>
<table class="table align-middle">
    <thead>
    <tr>
        <th>Name</th>
        <th>Company</th>
        <th>Email</th>
        <th>Status</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${recruiters}">
        <td th:text="${r.name}">Name</td>
        <td th:text="${r.company != null ? r.company.name : 'N/A'}">Company</td>
        <td th:text="${r.email}">Email</td>
        <td th:text="${r.activationStatus}">Pending</td>
        <td>
            <form th:action="@{'/admin/recruiters/' + ${r.id} + '/approve'}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-success">Approve</button>
            </form>
            <form th:action="@{'/admin/recruiters/' + ${r.id} + '/reject'}" method="post" class="d-inline ms-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-outline-danger">Reject</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
