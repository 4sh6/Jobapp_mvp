
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'Nexhire'">Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .hero { padding: 5rem 0; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">Nexhire</a>
        <div>
            <a class="btn btn-outline-primary me-2" href="/jobseeker/login">Jobseeker</a>
            <a class="btn btn-primary" href="/recruiter/login">Recruiter</a>
        </div>
    </div>
</nav>
<div class="container my-4">

<h3 class="mb-3">Jobseekers</h3>
<table class="table align-middle">
    <thead>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Profile completed</th>
        <th>Resume uploaded</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="js : ${jobseekers}">
        <td th:text="${js.fullName}">Name</td>
        <td th:text="${js.email}">Email</td>
        <td th:text="${js.profileCompleted}">false</td>
        <td th:text="${js.resumeUploaded}">false</td>
    </tr>
    </tbody>
</table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
