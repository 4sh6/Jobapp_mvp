<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Login - Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .brand { color: #6366f1; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; }
        .brand span { color: #e2e8f0; }
        h2 { color: #f1f5f9; font-weight: 700; margin-bottom: 0.25rem; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        label { color: #cbd5e1; font-size: 0.875rem; font-weight: 500; }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: #6366f1;
            color: #f1f5f9;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }
        .form-control::placeholder { color: #475569; }
        .btn-login {
            background: #6366f1;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #4f46e5; color: white; }
        .alert-danger { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; border-radius: 0.5rem; }
        .alert-success { background: #052e16; border-color: #14532d; color: #86efac; border-radius: 0.5rem; }
        .admin-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(99,102,241,0.15); color: #a5b4fc;
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 9999px; font-size: 0.78rem; font-weight: 600;
            padding: 0.25rem 0.75rem; margin-bottom: 1.5rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
            <div class="login-card">
                <div class="mb-4">
                    <div class="brand">Top<span>Hire</span></div>
                </div>

                <div class="admin-badge">
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    Admin Portal
                </div>

                <h2>Sign in</h2>
                <p class="subtitle">Access restricted to administrators only</p>

                <div th:if="${param.error}" class="alert alert-danger mb-3" role="alert">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success mb-3" role="alert">
                    You have been signed out.
                </div>

                <form th:action="@{/admin/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="admin" autocomplete="username" required autofocus/>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••••" autocomplete="current-password" required/>
                    </div>

                    <button type="submit" class="btn-login">Sign in to Admin Portal</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
