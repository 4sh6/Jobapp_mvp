
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin dashboard - Nexhire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">Nexhire</a>
        <div>
            <a class="btn btn-outline-secondary" href="/admin/recruiters">Recruiters</a>
            <a class="btn btn-outline-secondary ms-2" href="/admin/jobseekers">Jobseekers</a>
        </div>
    </div>
</nav>
<div class="container my-4">
<h2 class="mb-4">Admin dashboard</h2>
<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6 class="text-muted text-uppercase">Jobseekers</h6>
                <h3 th:text="${jobseekerCount}">0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6 class="text-muted text-uppercase">Recruiters</h6>
                <h3 th:text="${recruiterCount}">0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6 class="text-muted text-uppercase">Tracked events</h6>
                <h3 th:text="${eventCount}">0</h3>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-4">
        <a href="/admin/recruiters" class="card text-decoration-none text-dark shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Recruiters</h5>
                <p class="card-text small text-muted">Review and approve recruiter accounts.</p>
            </div>
        </a>
    </div>
    <div class="col-md-4">
        <a href="/admin/jobseekers" class="card text-decoration-none text-dark shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Jobseekers</h5>
                <p class="card-text small text-muted">View active candidates on the platform.</p>
            </div>
        </a>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
