
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'KoderHyre'">KoderHyre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; color: #6366f1 !important; }
        .hero { padding: 5rem 0; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/jobseeker/dashboard">KoderHyre</a>
        <div>
            <a class="btn btn-outline-primary me-2" href="/jobseeker/login">Jobseeker</a>
            <a class="btn btn-primary" href="/recruiter/login">Recruiter</a>
        </div>
    </div>
</nav>
<div class="container my-4">

<div class="row">
    <div class="col-md-8">
        <h2 class="mb-1" th:text="${job.title}">Job title</h2>
        <p class="text-muted">
            <span th:text="${job.location}">Location</span> •
            <span th:text="${job.workMode}">Remote</span>
        </p>
        <h5 class="mt-4">Role description</h5>
        <p th:text="${job.description}">Description...</p>

        <h5 class="mt-4">Required skills</h5>
        <p th:text="${job.requiredSkills}">Skills...</p>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5>Quick info</h5>
                <p class="mb-1">
                    <strong>Experience:</strong>
                    <span th:text="${job.experienceMin}">0</span> -
                    <span th:text="${job.experienceMax}">0</span> yrs
                </p>
                <p class="mb-1">
                    <strong>Salary:</strong>
                    <span th:text="${job.salaryMin}">0</span> -
                    <span th:text="${job.salaryMax}">0</span> LPA
                </p>
                <div th:if="${alreadyApplied}" class="alert alert-success mt-3 mb-0 text-center small fw-semibold">
                    ✓ You have already applied to this job
                </div>
                <div th:unless="${alreadyApplied}">
                    <form th:action="@{'/jobs/' + ${job.id} + '/apply'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-primary w-100 mt-3">Apply now</button>
                    </form>
                    <p class="small text-muted mt-2">You'll need to log in as a jobseeker to apply.</p>
                </div>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
