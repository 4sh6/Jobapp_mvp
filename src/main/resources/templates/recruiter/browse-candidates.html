<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Candidates — KoderHyre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/css/recruiter.css" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/recruiter-sidebar :: sidebar('candidates')}"></div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Browse Candidates</div>
        <div class="page-subtitle">Search across all jobseekers on the platform</div>
      </div>
    </div>

    <div class="page-body">

      <!-- Filter Bar -->
      <form th:action="@{/recruiter/candidates}" method="get">
        <div class="filter-bar">
          <div class="form-group">
            <label class="form-label" style="font-size:0.78rem;">Skills</label>
            <input type="text" name="skills" class="form-control" th:value="${filterSkills}"
                   placeholder="e.g. Java, React, Python"/>
          </div>
          <div class="form-group" style="max-width:140px;">
            <label class="form-label" style="font-size:0.78rem;">Min Exp (yrs)</label>
            <input type="number" name="expMin" class="form-control" th:value="${filterExpMin}" min="0" max="30"/>
          </div>
          <div class="form-group" style="max-width:140px;">
            <label class="form-label" style="font-size:0.78rem;">Max Exp (yrs)</label>
            <input type="number" name="expMax" class="form-control" th:value="${filterExpMax}" min="0" max="30"/>
          </div>
          <div>
            <button type="submit" class="btn-primary-custom" style="margin-top:1.4rem;">
              <i class="fas fa-search"></i> Search
            </button>
          </div>
          <div>
            <a href="/recruiter/candidates" class="btn-ghost" style="margin-top:1.4rem;">Reset</a>
          </div>
        </div>
      </form>

      <!-- Results header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
        <h5 style="font-weight:700;font-size:1rem;margin:0;">
          <i class="fas fa-users me-2 text-primary"></i>Candidates
        </h5>
        <span style="background:#eef2ff;color:#6366f1;font-weight:700;font-size:0.8rem;padding:0.3rem 0.8rem;border-radius:100px;"
              th:text="${candidatesPage.totalElements} + ' found'">0 found</span>
      </div>

      <!-- Empty -->
      <div th:if="${candidatesPage == null || candidatesPage.empty}" class="panel empty-state">
        <i class="fas fa-search"></i>
        <h4>No candidates found</h4>
        <p>Try different skill keywords or adjust the experience range.</p>
      </div>

      <!-- Grid -->
      <div th:if="${candidatesPage != null && !candidatesPage.empty}">
        <div th:each="candidate : ${candidatesPage.content}" class="person-card">
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div style="flex:1;min-width:0;">

              <div class="person-name" th:text="${candidate.jobseeker.fullName}">Name</div>
              <div class="person-headline"
                   th:text="${candidate.profileHeadline != null ? candidate.profileHeadline :
                             (candidate.currentRole != null ? candidate.currentRole : 'Candidate')}">
                Headline
              </div>

              <div class="person-meta">
                <span th:if="${candidate.experienceYears != null}">
                  <i class="fas fa-briefcase"></i><span th:text="${candidate.experienceYears}">0</span> yrs exp
                </span>
                <span th:if="${candidate.expectedCtc != null}">
                  <i class="fas fa-tag"></i><span th:text="${candidate.expectedCtc}">0</span> LPA expected
                </span>
                <span th:if="${candidate.workMode != null}">
                  <i class="fas fa-laptop-house"></i><span th:text="${candidate.workMode}">Mode</span>
                </span>
                <span th:if="${candidate.preferredLocations != null}">
                  <i class="fas fa-map-marker-alt"></i><span th:text="${candidate.preferredLocations}">Loc</span>
                </span>
              </div>

              <div th:if="${candidate.primarySkills != null and !candidate.primarySkills.isEmpty()}">
                <span th:each="skill : ${#strings.arraySplit(candidate.primarySkills, ',')}"
                      class="skill-chip" th:text="${skill.trim()}">Skill</span>
              </div>
              <div th:if="${candidate.skills != null and !candidate.skills.isEmpty()}" class="mt-1">
                <span th:each="skill : ${#strings.arraySplit(candidate.skills, ',')}"
                      class="skill-chip" th:text="${skill.trim()}">Skill</span>
              </div>
            </div>

            <div style="flex-shrink:0;text-align:right;min-width:200px;">
              <div style="font-size:0.72rem;color:#94a3b8;margin-bottom:0.5rem;" th:if="${candidate.jobseeker.resumeUploaded}">
                <i class="fas fa-file-alt me-1 text-success"></i>Resume available
              </div>
              <a th:href="@{'/recruiter/candidate/' + ${candidate.jobseeker.id}}"
                 class="btn-ghost" style="font-size:0.78rem;padding:0.35rem 0.8rem;display:block;margin-bottom:0.5rem;">
                <i class="fas fa-user"></i> View Profile
              </a>
              <div th:if="${myJobs != null and !myJobs.isEmpty()}">
                <form method="post"
                      th:id="'inv-' + ${candidate.jobseeker.id}"
                      onsubmit="return submitInvite(this)">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="jobseekerId" th:value="${candidate.jobseeker.id}"/>
                  <select class="form-select form-select-sm mb-1"
                          style="font-size:0.78rem;"
                          name="jobId">
                    <option value="">Select a job…</option>
                    <option th:each="j : ${myJobs}" th:value="${j.id}" th:text="${j.title}">Job</option>
                  </select>
                  <button type="submit" class="btn-primary-custom w-100" style="font-size:0.78rem;padding:0.35rem 0.8rem;">
                    <i class="fas fa-paper-plane"></i> Send Invite
                  </button>
                </form>
              </div>
              <div th:if="${myJobs == null or myJobs.isEmpty()}"
                   style="font-size:0.75rem;color:#94a3b8;">
                No active jobs to invite for
              </div>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${candidatesPage.totalPages > 1}">
          <ul class="pagination">
            <li class="page-item" th:classappend="${candidatesPage.first} ? 'disabled' : ''">
              <a class="page-link" th:href="@{/recruiter/candidates(page=${candidatesPage.number - 1}, skills=${filterSkills}, expMin=${filterExpMin}, expMax=${filterExpMax})}">
                <i class="fas fa-chevron-left"></i>
              </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, candidatesPage.totalPages - 1)}"
                th:classappend="${i == candidatesPage.number} ? 'active' : ''">
              <a class="page-link" th:href="@{/recruiter/candidates(page=${i}, skills=${filterSkills}, expMin=${filterExpMin}, expMax=${filterExpMax})}"
                 th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${candidatesPage.last} ? 'disabled' : ''">
              <a class="page-link" th:href="@{/recruiter/candidates(page=${candidatesPage.number + 1}, skills=${filterSkills}, expMin=${filterExpMin}, expMax=${filterExpMax})}">
                <i class="fas fa-chevron-right"></i>
              </a>
            </li>
          </ul>
        </nav>
      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function submitInvite(form) {
    var jobId = form.querySelector('select[name="jobId"]').value;
    var jobseekerId = form.querySelector('input[name="jobseekerId"]').value;
    if (!jobId) {
        alert('Please select a job before sending the invite.');
        return false;
    }
    form.action = '/recruiter/jobs/' + jobId + '/invite/' + jobseekerId;
    return true;
}
</script>
</body>
</html>
