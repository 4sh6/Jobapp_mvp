<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recruiter Login — HireFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/css/recruiter.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">H</div>
      <span class="auth-logo-name">HireFlow</span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your recruiter dashboard</p>

    <div th:if="${param.error}" class="flash-bar flash-error mb-4">
      <i class="fas fa-exclamation-circle"></i>
      Invalid email or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="flash-bar flash-success mb-4">
      <i class="fas fa-check-circle"></i>
      You've been signed out successfully.
    </div>

    <form th:action="@{/recruiter/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label class="form-label">Work email</label>
        <input type="email" name="username" class="form-control" placeholder="you@company.com" required autofocus/>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label mb-0">Password</label>
        </div>
        <div class="input-group">
          <input type="password" name="password" id="loginPassword" class="form-control" placeholder="Your password" required/>
          <button type="button" class="btn btn-outline-secondary border-start-0"
                  onclick="togglePw('loginPassword', this)" style="border-radius:0 8px 8px 0; border: 1.5px solid #e2e8f0;">
            <i class="fas fa-eye" style="font-size:0.85rem;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding: 0.75rem;">
        Sign in
      </button>
    </form>

    <div class="auth-footer mt-3">
      Don't have an account? <a href="/recruiter/register">Create one</a>
    </div>
    <div class="auth-footer mt-1">
      <a href="/" class="text-muted">← Back to homepage</a>
    </div>

  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
