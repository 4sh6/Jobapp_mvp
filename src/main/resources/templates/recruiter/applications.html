<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Applications — Nexhire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/css/recruiter.css" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/recruiter-sidebar :: sidebar('dashboard')}"></div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Applications</div>
        <div class="page-subtitle" th:text="'Applicants for: ' + ${job.title}">Applicants</div>
      </div>
      <a href="/recruiter/dashboard" class="btn-ghost">
        <i class="fas fa-arrow-left"></i> Dashboard
      </a>
    </div>

    <div class="page-body">

      <div th:if="${success}" class="flash-bar flash-success">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
      </div>

      <div class="row g-4">

        <!-- Job Context Panel -->
        <div class="col-lg-3">
          <div class="context-panel">
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#64748b;margin-bottom:0.5rem;">Job</div>
            <div class="job-title-big" th:text="${job.title}">Job Title</div>
            <div style="font-size:0.825rem;color:#64748b;margin-top:0.25rem;">
              <i class="fas fa-map-marker-alt me-1"></i>
              <span th:text="${job.location}">Location</span>
            </div>

            <div class="context-label">Work Mode</div>
            <div style="font-size:0.85rem;font-weight:500;" th:text="${job.workMode}">HYBRID</div>

            <div class="context-label">Experience</div>
            <div style="font-size:0.85rem;font-weight:500;">
              <span th:text="${job.experienceMin}">0</span>–<span th:text="${job.experienceMax}">5</span> yrs
            </div>

            <div class="context-label">Salary</div>
            <div style="font-size:0.85rem;font-weight:500;">
              <span th:text="${job.salaryMin}">10</span>–<span th:text="${job.salaryMax}">20</span> LPA
            </div>

            <div class="context-label">Required Skills</div>
            <div style="font-size:0.8rem;color:#374151;" th:text="${job.requiredSkills}">Skills</div>

            <a th:href="@{'/recruiter/jobs/' + ${job.id} + '/candidates'}"
               class="btn-primary-custom w-100 justify-content-center mt-3" style="font-size:0.8rem;padding:0.55rem;">
              <i class="fas fa-users"></i> Find Candidates
            </a>
          </div>
        </div>

        <!-- Applicants List -->
        <div class="col-lg-9">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
            <h5 style="font-weight:700;font-size:1rem;margin:0;">
              <i class="fas fa-file-alt me-2 text-primary"></i>
              Applications Received
            </h5>
            <span style="background:#eef2ff;color:#6366f1;font-weight:700;font-size:0.8rem;padding:0.3rem 0.8rem;border-radius:100px;"
                  th:text="${applications.size()} + ' total'">0 total</span>
          </div>

          <!-- Empty -->
          <div th:if="${applications.isEmpty()}" class="panel empty-state">
            <i class="fas fa-inbox"></i>
            <h4>No applicants yet</h4>
            <p>Once candidates apply to this job, they'll show up here.</p>
          </div>

          <!-- Cards -->
          <div th:unless="${applications.isEmpty()}">
            <div th:each="app : ${applications}" class="person-card">
              <div class="d-flex justify-content-between align-items-start gap-3">
                <div style="flex:1;min-width:0;">
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <div class="person-name" th:text="${app.jobseeker.fullName}">Name</div>
                    <span th:if="${app.source == 'invite'}" class="badge-status badge-accepted" style="font-size:0.65rem;">
                      Via Invite
                    </span>
                  </div>

                  <div class="person-meta">
                    <span><i class="fas fa-envelope"></i><span th:text="${app.jobseeker.email}">email</span></span>
                    <span><i class="far fa-clock"></i>Applied <span th:text="${#temporals.format(app.appliedDate, 'dd MMM yyyy')}">Date</span></span>
                  </div>

                  <div class="mt-2">
                    <span class="badge-status"
                          th:classappend="${app.status.name() == 'APPLIED'} ? ' badge-applied' :
                                         (${app.status.name() == 'UNDER_REVIEW'} ? ' badge-under_review' :
                                         (${app.status.name() == 'SHORTLISTED'} ? ' badge-shortlisted' :
                                         (${app.status.name() == 'REJECTED'} ? ' badge-rejected' : ' badge-hired')))"
                          th:text="${app.status.name().replace('_',' ')}">Status</span>
                  </div>
                </div>

                <div style="flex-shrink:0;text-align:right;">
                  <form method="post" th:action="@{'/recruiter/applications/' + ${app.id} + '/status'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <label style="font-size:0.75rem;font-weight:600;color:#64748b;display:block;margin-bottom:4px;">Update Status</label>
                    <div class="d-flex gap-2">
                      <select name="status" class="form-select form-select-sm" style="min-width:140px;font-size:0.8rem;">
                        <option value="APPLIED"       th:selected="${app.status.name() == 'APPLIED'}">Applied</option>
                        <option value="UNDER_REVIEW"  th:selected="${app.status.name() == 'UNDER_REVIEW'}">Under Review</option>
                        <option value="SHORTLISTED"   th:selected="${app.status.name() == 'SHORTLISTED'}">Shortlisted</option>
                        <option value="REJECTED"      th:selected="${app.status.name() == 'REJECTED'}">Rejected</option>
                        <option value="HIRED"         th:selected="${app.status.name() == 'HIRED'}">Hired</option>
                      </select>
                      <button type="submit" class="btn-primary-custom" style="padding:0.4rem 0.8rem;font-size:0.8rem;">
                        Save
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
