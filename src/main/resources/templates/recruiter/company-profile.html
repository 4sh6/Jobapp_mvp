<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Profile — Nexhire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/css/recruiter.css" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/recruiter-sidebar :: sidebar('company')}"></div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Company Profile</div>
        <div class="page-subtitle">Manage your company details shown to candidates</div>
      </div>
    </div>

    <div class="page-body">

      <div th:if="${success}" class="flash-bar flash-success">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
      </div>
      <div th:if="${error}" class="flash-bar flash-error">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
      </div>

      <div style="max-width:760px;">
        <form th:action="@{/recruiter/company}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- Company section -->
          <div class="profile-section">
            <h5><i class="fas fa-building me-2"></i>Company Details</h5>

            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label">Company name *</label>
                <input type="text" name="companyName" class="form-control"
                       th:value="${company != null ? company.name : ''}" required
                       placeholder="Acme Corp"/>
              </div>
              <div class="col-md-4">
                <label class="form-label">Industry</label>
                <select name="industry" class="form-select">
                  <option value="">Select industry...</option>
                  <option value="Technology" th:selected="${company != null and company.industry == 'Technology'}">Technology</option>
                  <option value="Finance" th:selected="${company != null and company.industry == 'Finance'}">Finance</option>
                  <option value="Healthcare" th:selected="${company != null and company.industry == 'Healthcare'}">Healthcare</option>
                  <option value="E-commerce" th:selected="${company != null and company.industry == 'E-commerce'}">E-commerce</option>
                  <option value="SaaS" th:selected="${company != null and company.industry == 'SaaS'}">SaaS</option>
                  <option value="Consulting" th:selected="${company != null and company.industry == 'Consulting'}">Consulting</option>
                  <option value="Education" th:selected="${company != null and company.industry == 'Education'}">Education</option>
                  <option value="Manufacturing" th:selected="${company != null and company.industry == 'Manufacturing'}">Manufacturing</option>
                  <option value="Other" th:selected="${company != null and company.industry == 'Other'}">Other</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label">Website</label>
                <input type="url" name="website" class="form-control"
                       th:value="${company != null ? company.website : ''}"
                       placeholder="https://yourcompany.com"/>
              </div>
              <div class="col-md-4">
                <label class="form-label">Company size</label>
                <select name="sizeBand" class="form-select">
                  <option value="">Select size...</option>
                  <option value="1-10"    th:selected="${company != null and company.sizeBand == '1-10'}">1–10</option>
                  <option value="11-50"   th:selected="${company != null and company.sizeBand == '11-50'}">11–50</option>
                  <option value="51-200"  th:selected="${company != null and company.sizeBand == '51-200'}">51–200</option>
                  <option value="201-500" th:selected="${company != null and company.sizeBand == '201-500'}">201–500</option>
                  <option value="501-1000" th:selected="${company != null and company.sizeBand == '501-1000'}">501–1,000</option>
                  <option value="1000+"   th:selected="${company != null and company.sizeBand == '1000+'}">1,000+</option>
                </select>
              </div>
            </div>

            <div class="mb-0">
              <label class="form-label">About the company</label>
              <textarea name="description" class="form-control" rows="5"
                        placeholder="Tell candidates what makes your company a great place to work..."
                        th:text="${company != null ? company.description : ''}"></textarea>
            </div>
          </div>

          <!-- Your info section -->
          <div class="profile-section">
            <h5><i class="fas fa-user me-2"></i>Your Details</h5>

            <div class="row g-3 mb-0">
              <div class="col-md-6">
                <label class="form-label">Your job title</label>
                <input type="text" name="jobTitle" class="form-control"
                       th:value="${recruiter.jobTitle}" placeholder="Head of Talent"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone number</label>
                <input type="text" name="phoneNumber" class="form-control"
                       th:value="${recruiter.phoneNumber}" placeholder="+91 98765 43210"/>
              </div>
            </div>
          </div>

          <!-- Read-only info -->
          <div class="profile-section">
            <h5><i class="fas fa-lock me-2"></i>Account Info</h5>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <div class="form-control" style="background:#f8fafc;color:#64748b;" th:text="${recruiter.email}">email</div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Account status</label>
                <div class="mt-1">
                  <span class="badge-status"
                        th:classappend="${recruiter.activationStatus == 'Active'} ? ' badge-published' : ' badge-pending'"
                        th:text="${recruiter.activationStatus}">Active</span>
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Plan</label>
                <div class="mt-1">
                  <span style="background:#f5f3ff;color:#7c3aed;font-weight:600;font-size:0.78rem;padding:0.3rem 0.7rem;border-radius:100px;"
                        th:text="${recruiter.plan}">FREE</span>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn-primary-custom">
              <i class="fas fa-save"></i> Save Changes
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
