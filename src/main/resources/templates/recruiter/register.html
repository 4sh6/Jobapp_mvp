<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Recruiter Account — KoderHyre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/css/recruiter.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width: 580px;">

    <div class="auth-logo">
      <div class="auth-logo-icon">K</div>
      <span class="auth-logo-name">Koder<span class="accent">Hyre</span></span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start hiring top tech talent today</p>

    <div th:if="${error}" class="flash-bar flash-error mb-4">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${error}">Error</span>
    </div>

    <form th:action="@{/recruiter/register}" method="post" th:object="${recruiterRegistrationDto}" id="registerForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Your full name</label>
          <input type="text" class="form-control" th:field="*{name}" placeholder="Jane Smith" required/>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Work email</label>
          <input type="email" class="form-control" th:field="*{email}" placeholder="jane@company.com" required/>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" id="regPassword" class="form-control" th:field="*{password}"
                 placeholder="Min. 8 characters" required minlength="8" oninput="checkStrength(this.value)"/>
          <button type="button" class="btn btn-outline-secondary border-start-0"
                  onclick="togglePw('regPassword', this)" style="border-radius:0 8px 8px 0; border: 1.5px solid #e2e8f0;">
            <i class="fas fa-eye" style="font-size:0.85rem;"></i>
          </button>
        </div>
        <div class="strength-bar-wrap mt-1">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="form-text" id="strengthLabel"></div>
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Company name</label>
          <input type="text" class="form-control" th:field="*{companyName}" placeholder="Acme Corp" required/>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Company website <span class="text-muted fw-normal">(optional)</span></label>
          <input type="url" class="form-control" th:field="*{website}" placeholder="https://acme.com"/>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Your job title</label>
          <input type="text" class="form-control" th:field="*{jobTitle}" placeholder="Head of Talent" required/>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('jobTitle')}" th:errors="*{jobTitle}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone number</label>
          <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="+91 98765 43210" required/>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-primary-custom w-100 justify-content-center" style="padding: 0.75rem;">
        Create account
      </button>
    </form>

    <div class="auth-footer mt-3">
      Already have an account? <a href="/recruiter/login">Sign in</a>
    </div>
    <div class="auth-footer mt-1">
      <a href="/" class="text-muted">← Back to homepage</a>
    </div>

  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

function checkStrength(val) {
  const bar = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { pct: '25%', color: '#ef4444', text: 'Weak' },
    { pct: '50%', color: '#f59e0b', text: 'Fair' },
    { pct: '75%', color: '#3b82f6', text: 'Good' },
    { pct: '100%', color: '#10b981', text: 'Strong' }
  ];
  if (val.length === 0) { bar.style.width = '0'; label.textContent = ''; return; }
  const lvl = levels[Math.max(0, score - 1)];
  bar.style.width = lvl.pct;
  bar.style.background = lvl.color;
  label.textContent = lvl.text;
  label.style.color = lvl.color;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
