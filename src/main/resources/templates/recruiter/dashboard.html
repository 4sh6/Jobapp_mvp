<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'JobApp'">JobApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .card { border-radius: 1rem; }
        .pagination { margin-top: 2rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">JobApp</a>
        <div>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger">Sign Out</button>
            </form>
        </div>
    </div>
</nav>
<div class="container my-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Hi, <span th:text="${recruiter.name}">Recruiter</span></h2>
        <p class="text-muted">Manage your active roles and track applications.</p>
    </div>
    <div>
        <a href="/recruiter/jobs/new" class="btn btn-primary"><i class="fas fa-plus me-2"></i>Post a new job</a>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="p-4 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Your Posted Jobs</h5>
        </div>

        <div class="p-4 text-center text-muted" th:if="${jobsPage == null || jobsPage.empty}">
            <i class="fas fa-briefcase fa-3x mb-3 opacity-50"></i>
            <p>You haven't posted any jobs yet.</p>
            <a href="/recruiter/jobs/new" class="btn btn-outline-primary mt-2">Post your first job</a>
        </div>

        <table class="table align-middle mb-0" th:if="${jobsPage != null && !jobsPage.empty}">
            <thead class="table-light">
            <tr>
                <th class="ps-4">Job Title & Location</th>
                <th>Status</th>
                <th>Posted Date</th>
                <th>Applicants</th>
                <th class="text-end pe-4">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${jobsPage.content}">
                <td class="ps-4">
                    <div class="fw-bold text-dark" th:text="${job.title}">Title</div>
                    <div class="small text-muted"><i class="fas fa-map-marker-alt me-1"></i><span th:text="${job.location}">Location</span></div>
                </td>
                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${job.status == 'PUBLISHED' ? 'bg-success' : (job.status == 'CLOSED' ? 'bg-secondary' : 'bg-warning')}"
                          th:text="${job.status}">PUBLISHED</span>
                </td>
                <td><span th:text="${#temporals.format(job.postedDate, 'dd MMM yyyy')}">Date</span></td>
                <td>
                    <a th:href="@{'/recruiter/jobs/' + ${job.id} + '/applications'}" class="text-decoration-none">
                        <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${applicationCounts[job.id] ?: 0}">0</span>
                    </a>
                </td>
                <td class="text-end pe-4">
                    <div class="dropdown">
                        <button class="btn btn-light btn-sm rounded-circle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li><a class="dropdown-item" th:href="@{'/recruiter/jobs/' + ${job.id} + '/candidates'}"><i class="fas fa-users me-2 text-primary"></i>Find Candidates</a></li>
                            <li><a class="dropdown-item" th:href="@{'/recruiter/jobs/' + ${job.id} + '/edit'}"><i class="fas fa-edit me-2 text-secondary"></i>Edit Job</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li th:if="${job.active}">
                                <form method="post" th:action="@{'/recruiter/jobs/' + ${job.id} + '/close'}" style="margin:0;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="dropdown-item text-danger"><i class="fas fa-times-circle me-2"></i>Close Job</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Pagination -->
<nav th:if="${jobsPage != null && jobsPage.totalPages > 1}">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${jobsPage.first} ? 'disabled' : ''">
            <a class="page-link" th:href="@{/recruiter/dashboard(page=${jobsPage.number - 1})}"><i class="fas fa-chevron-left"></i></a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, jobsPage.totalPages - 1)}"
            th:classappend="${i == jobsPage.number} ? 'active' : ''">
            <a class="page-link" th:href="@{/recruiter/dashboard(page=${i})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${jobsPage.last} ? 'disabled' : ''">
            <a class="page-link" th:href="@{/recruiter/dashboard(page=${jobsPage.number + 1})}"><i class="fas fa-chevron-right"></i></a>
        </li>
    </ul>
</nav>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
