<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post a Job — HireFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="/css/recruiter.css" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/recruiter-sidebar :: sidebar('post-job')}"></div>

  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Post a New Job</div>
        <div class="page-subtitle">Fill in the details to publish your job listing</div>
      </div>
      <a href="/recruiter/dashboard" class="btn-ghost">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>
    </div>

    <div class="page-body">
      <div style="max-width:760px;">
        <form th:action="@{/recruiter/jobs}" th:object="${jobDto}" method="post" class="form-card">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <h5 style="font-weight:700;margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid #e2e8f0;">
            Basic Information
          </h5>

          <div class="mb-3">
            <label class="form-label">Job title *</label>
            <input type="text" class="form-control" th:field="*{title}" placeholder="e.g. Senior Backend Engineer"/>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Location *</label>
              <input type="text" class="form-control" th:field="*{location}" placeholder="e.g. Bangalore, India"/>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Work mode *</label>
              <select class="form-select" th:field="*{workMode}">
                <option value="">Select...</option>
                <option value="ONSITE">On-site</option>
                <option value="REMOTE">Remote</option>
                <option value="HYBRID">Hybrid</option>
              </select>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('workMode')}" th:errors="*{workMode}"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Job type</label>
              <select class="form-select" th:field="*{jobType}">
                <option value="FULL_TIME">Full Time</option>
                <option value="PART_TIME">Part Time</option>
                <option value="CONTRACT">Contract</option>
              </select>
            </div>
          </div>

          <h5 style="font-weight:700;margin:1.75rem 0 1.25rem;padding-top:1rem;border-top:1px solid #e2e8f0;">
            Experience & Compensation
          </h5>

          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label">Min experience (yrs) *</label>
              <input type="number" class="form-control" th:field="*{experienceMin}" min="0" max="30" placeholder="0"/>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('experienceMin')}" th:errors="*{experienceMin}"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Max experience (yrs) *</label>
              <input type="number" class="form-control" th:field="*{experienceMax}" min="0" max="30" placeholder="5"/>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('experienceMax')}" th:errors="*{experienceMax}"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Min salary (LPA) *</label>
              <input type="number" class="form-control" th:field="*{salaryMin}" min="0" placeholder="10"/>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salaryMin')}" th:errors="*{salaryMin}"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Max salary (LPA) *</label>
              <input type="number" class="form-control" th:field="*{salaryMax}" min="0" placeholder="20"/>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salaryMax')}" th:errors="*{salaryMax}"></div>
            </div>
          </div>

          <h5 style="font-weight:700;margin:1.75rem 0 1.25rem;padding-top:1rem;border-top:1px solid #e2e8f0;">
            Job Details
          </h5>

          <div class="mb-3">
            <label class="form-label">Required skills *</label>
            <input type="text" class="form-control" th:field="*{requiredSkills}"
                   placeholder="e.g. Java, Spring Boot, Kubernetes, PostgreSQL"/>
            <div class="form-text">Comma-separated list of skills.</div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('requiredSkills')}" th:errors="*{requiredSkills}"></div>
          </div>

          <div class="mb-4">
            <label class="form-label">Job description *</label>
            <textarea class="form-control" th:field="*{description}" rows="8"
                      placeholder="Describe the role, responsibilities, and what you're looking for..."></textarea>
            <div class="form-text">Up to 4,000 characters.</div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn-primary-custom">
              <i class="fas fa-rocket"></i> Publish Job
            </button>
            <a href="/recruiter/dashboard" class="btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
