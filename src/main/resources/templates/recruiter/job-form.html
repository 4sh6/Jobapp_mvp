
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'JobApp'">JobApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
        .hero { padding: 5rem 0; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">JobApp</a>
        <div>
            <a class="btn btn-outline-primary me-2" href="/jobseeker/login">Jobseeker</a>
            <a class="btn btn-primary" href="/recruiter/login">Recruiter</a>
        </div>
    </div>
</nav>
<div class="container my-4">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Post a new job</h3>
                <form th:action="@{/recruiter/jobs}" th:object="${job}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label">Job title</label>
                        <input type="text" class="form-control" th:field="*{title}" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" th:field="*{location}" required/>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Work mode</label>
                            <select class="form-select" th:field="*{workMode}">
                                <option value="ONSITE">On-site</option>
                                <option value="REMOTE">Remote</option>
                                <option value="HYBRID">Hybrid</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Experience min (years)</label>
                            <input type="number" class="form-control" th:field="*{experienceMin}"/>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Experience max (years)</label>
                            <input type="number" class="form-control" th:field="*{experienceMax}"/>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary min (LPA)</label>
                            <input type="number" class="form-control" th:field="*{salaryMin}"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary max (LPA)</label>
                            <input type="number" class="form-control" th:field="*{salaryMax}"/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Required skills</label>
                        <textarea class="form-control" th:field="*{requiredSkills}" rows="2"></textarea>
                        <div class="form-text">Comma-separated skills.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role description</label>
                        <textarea class="form-control" th:field="*{description}" rows="5"></textarea>
                    </div>
                    <button class="btn btn-primary">Publish job</button>
                    <a href="/recruiter/dashboard" class="btn btn-link">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
