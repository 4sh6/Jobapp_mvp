spring.application.name=demo
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# --- Error Handling (Production Hardening) ---
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
# SECURITY: never expose raw exception messages to clients
server.error.include-message=never

# --- File Upload Limits (Prevents DoS attacks via large files) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Email Configuration ---
# Local dev: use Mailtrap (sandbox.smtp.mailtrap.io:2525) — set MAIL_USERNAME and MAIL_PASSWORD from Mailtrap dashboard
# Production: switch to real SMTP (e.g. Gmail/SendGrid) via env vars below
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Session Timeout (24-hour inactivity) ---
server.servlet.session.timeout=24h

# --- Database Configuration ---
# Development default: H2 in-memory (data lost on restart)
# Production: set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, DB_DIALECT env vars
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nexhire;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update

# Disable schema.sql & data.sql execution (fixes index error)
spring.sql.init.mode=never


# --- Performance Tuning (Batching for High Volume) ---
# Critical for "Recruiter Dashboard" when loading many candidates
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- H2 Console (Dev Only) ---
# SECURITY: set H2_CONSOLE_ENABLED=false in production (defaults true for local dev).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# --- Actuator Security ---
# SECURITY: only expose health endpoint; show-details only when authorized
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# --- Logging (For debugging flows) ---
logging.level.com.example=INFO
logging.level.org.springframework.security=WARN

# --- CockroachDB / PostgreSQL Production Notes ---
# Set these env vars when deploying to production:
#
# DB_URL=jdbc:postgresql://<host>:26257/<dbname>?sslmode=verify-full
# DB_USERNAME=<cockroachdb-username>
# DB_PASSWORD=<cockroachdb-password>
# DB_DRIVER=org.postgresql.Driver
# DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect

# --- Admin Portal (JWT-based REST API) ---
# SECURITY: Override all three via environment variables before deploying.
# Generate a strong JWT secret: openssl rand -hex 32
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
# Default is a safe dev-only secret. Production MUST set ADMIN_JWT_SECRET env var.
admin.jwt.secret=${ADMIN_JWT_SECRET:nexhire-dev-only-jwt-secret-key-do-not-use-in-production-32}
admin.jwt.expiration-ms=28800000

# --- Google OAuth2 Configuration ---
# SECURITY: Use environment variables for credentials
# See .env.example for setup instructions
spring.security.oauth2.client.registration.google-jobseeker.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google-jobseeker.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google-jobseeker.client-name=Google
spring.security.oauth2.client.registration.google-jobseeker.provider=google
spring.security.oauth2.client.registration.google-jobseeker.scope=openid,profile,email
spring.security.oauth2.client.registration.google-jobseeker.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub


