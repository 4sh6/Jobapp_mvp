spring.application.name=demo
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# --- Error Handling (Production Hardening) ---
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=always

# --- File Upload Limits (Prevents DoS attacks via large files) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Email Configuration - SECURED ---
# NEVER commit real passwords to git. Use environment variables.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Database Configuration (H2 for Dev / Prepared for Postgres) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# Disable schema.sql & data.sql execution (fixes index error)
spring.sql.init.mode=never


# --- Performance Tuning (Batching for High Volume) ---
# Critical for "Recruiter Dashboard" when loading many candidates
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- H2 Console (Dev Only - disabled in production) ---
# Enable by running with: --spring.profiles.active=dev
spring.h2.console.enabled=false

# --- Actuator Security & Analytics ---
# Expose metrics to track "Job Views" and "Application Counts"
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Logging (For debugging flows) ---
logging.level.com.example=INFO
logging.level.org.springframework.security=WARN

