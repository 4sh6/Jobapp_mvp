spring.application.name=demo
spring.profiles.active=dev
server.port=${PORT:8080}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# --- Error Handling (Production Hardening) ---
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
# SECURITY: never expose raw exception messages to clients
server.error.include-message=never

# --- File Upload Limits (Prevents DoS attacks via large files) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Email Configuration (Resend HTTP API — see EmailService) ---
# Render's free tier blocks outbound SMTP ports entirely, so email is sent via
# Resend's HTTPS API instead of javax.mail. Set RESEND_API_KEY in production;
# without it, EmailService logs emails to the console (safe for local dev).
# RESEND_API_KEY=<your Resend API key>
# RESEND_FROM_EMAIL=KoderHyre <noreply@koderhyre.com>

# --- Session Timeout (24-hour inactivity) ---
server.servlet.session.timeout=24h

# --- Database Configuration ---
# Development default: H2 in-memory (data lost on restart)
# Production: set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, DB_DIALECT env vars
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nexhire;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update

# Disable schema.sql & data.sql execution (fixes index error)
spring.sql.init.mode=never


# --- Performance Tuning (Batching for High Volume) ---
# Critical for "Recruiter Dashboard" when loading many candidates
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- H2 Console (Dev Only) ---
# SECURITY: set H2_CONSOLE_ENABLED=false in production (defaults true for local dev).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# --- Actuator Security ---
# SECURITY: only expose health endpoint; show-details only when authorized
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# --- Logging (For debugging flows) ---
logging.level.com.example=INFO
logging.level.org.springframework.security=WARN

# --- CockroachDB Production Notes ---
# CockroachDB speaks the PostgreSQL wire protocol, so the existing `postgresql`
# JDBC driver (already in pom.xml) connects to it directly — no new dependency needed.
# Hibernate ships a dedicated CockroachDialect (since 6.2) that handles CRDB's SQL
# differences correctly; do NOT use PostgreSQLDialect for CockroachDB.
#
# Set these env vars when deploying to production (from the CockroachDB Cloud console,
# "Connect" tab on your Basic cluster):
#
# DB_URL=jdbc:postgresql://<cluster-host>.cockroachlabs.cloud:26257/<dbname>?sslmode=verify-full&options=--cluster%3D<cluster-name>
#   ^ CockroachDB Basic routes through a shared gateway, so the "options=--cluster=<name>"
#     query param is REQUIRED (copy it verbatim from the console) — omitting it is the
#     most common connection failure with the free tier.
# DB_USERNAME=<cockroachdb-username>
# DB_PASSWORD=<cockroachdb-password>
# DB_DRIVER=org.postgresql.Driver
# DB_DIALECT=org.hibernate.dialect.CockroachDialect
#
# GenerationType.IDENTITY (used on every @Id in this codebase) runs correctly on
# CockroachDB with zero code changes at this app's write volume. CockroachDB's own
# docs discourage sequential IDs at very high write throughput (they cause "hotspot"
# ranges) — irrelevant below roughly thousands of inserts/sec, so not a concern here;
# revisit only if write volume grows dramatically.

# --- Résumé File Storage (Cloudflare R2) ---
# Local dev default: empty credentials — FileStorageService falls back to storing
# résumés on local disk under ./uploads/resumes (same as before), no R2 account needed.
# Production: set these env vars to switch to R2 automatically. Get them from
# Cloudflare dashboard → R2 → Manage API Tokens (create a token scoped to one bucket).
#
# R2_ACCOUNT_ID=<your-cloudflare-account-id>
# R2_ACCESS_KEY_ID=<r2-access-key-id>
# R2_SECRET_ACCESS_KEY=<r2-secret-access-key>
# R2_BUCKET_NAME=koderhyre-resumes
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:koderhyre-resumes}

# --- Admin Portal (JWT-based REST API) ---
# SECURITY: Override all three via environment variables before deploying.
# Generate a strong JWT secret: openssl rand -hex 32
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
# Default is a safe dev-only secret. Production MUST set ADMIN_JWT_SECRET env var.
admin.jwt.secret=${ADMIN_JWT_SECRET:koderhyre-dev-only-jwt-secret-key-do-not-use-in-production-32}
admin.jwt.expiration-ms=28800000

# --- Google OAuth2 Configuration ---
# SECURITY: Use environment variables for credentials
# See .env.example for setup instructions
spring.security.oauth2.client.registration.google-jobseeker.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google-jobseeker.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google-jobseeker.client-name=Google
spring.security.oauth2.client.registration.google-jobseeker.provider=google
spring.security.oauth2.client.registration.google-jobseeker.scope=openid,profile,email
spring.security.oauth2.client.registration.google-jobseeker.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub


